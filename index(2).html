function validateExtra(d){

function validate(d){if(!d||d.schema!==SCHEMA||!d.settings)throw Error('Formato de backup não reconhecido.');const arrays=['catalog','products','clients','leads','jobs','payments','expenses','purchases','campaigns','audit'];arrays.forEach(k=>{if(!Array.isArray(d[k])||d[k].length>50000)throw Error('Lista inválida: '+k);});const walk=(o,depth=0)=>{if(depth>18)throw Error('Backup muito complexo.');if(typeof o==='number'&&!Number.isFinite(o))throw Error('Número inválido.');if(o&&typeof o==='object')Object.entries(o).forEach(([k,v])=>{if(['__proto__','constructor','prototype'].includes(k))throw Error('Campo não permitido.');walk(v,depth+1);});};walk(d);for(const k of arrays){const ids=d[k].map(x=>x.id);if(ids.some(x=>typeof x!=='string'||!/^[\w-]{1,120}$/.test(x))||new Set(ids).size!==ids.length)throw Error('Identificadores inválidos em '+k);}const nonneg=(v)=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1e12;for(const s of ['opening','gas','fixedTarget','ownerTarget','cashFloor','monthlyGoal'])if(!nonneg(d.settings[s])||!Number.isInteger(d.settings[s]))throw Error('Configuração monetária inválida.');for(const s of ['tax','cardFee','marketingShare'])if(!nonneg(d.settings[s])||d.settings[s]>100)throw Error('Percentual inválido.');if(!(d.settings.kmL>0)||!validDate(d.settings.openingDate))throw Error('Consumo ou data inicial inválida.');for(const k of ['payments','expenses','purchases'])d[k].forEach(x=>{if(!Number.isInteger(x.amount)||!nonneg(x.amount)||!validDate(x.date))throw Error('Valor ou data inválida em '+k);});d.products.forEach(p=>{if(!nonneg(p.cost)||!nonneg(p.initial)||!nonneg(p.min)||!(p.pack>0))throw Error('Produto inválido.');});d.jobs.forEach(j=>{if(!Object.hasOwn(STATUSES,j.status)||!validDate(j.date)||!Array.isArray(j.items)||!Array.isArray(j.usage)||!d.clients.some(c=>c.id===j.clientId))throw Error('Serviço inválido.');j.items.forEach(i=>{if(!Number.isInteger(i.price)||!nonneg(i.price)||!(i.qty>0)||!Number.isInteger(i.qty))throw Error('Item inválido. function consumption(j){return Math.round(sum(j.usage,u=>u.ml*u.unitCost));}
function taxJob(j){return Math.round(totalJob(j)*j.tax/100);}
function feeJob(j){return Math.round(totalJob(j)*j.fee/100);}
function stock(p,d=data,until='9999-12-31'){return p.initial+sum(d.purchases.filter(x=>x.productId===p.id&&x.date<=until),x=>x.qty)-sum(d.jobs.filter(j=>j.status==='done'&&j.completedDate<=until),j=>sum(j.usage.filter(u=>u.productId===p.id),u=>u.ml));}
function productCost(p,d=data){const q=stock(p,d),v=p.initial*p.cost+sum(d.purchases.filter(x=>x.productId===p.id),x=>x.amount)-sum(d.jobs.filter(j=>j.status==='done'),j=>sum(j.usage.filter(u=>u.productId===p.id),u=>u.ml*u.unitCost));return q>0?Math.max(0,v/q):(d.purchases.filter(x=>x.productId===p.id).slice(-1).map(x=>x.amount/x.qty)[0]??p.cost);}
function linkedExpenses(j,d=data){return d.expenses.filter(e=>e.jobId===j.id&&!NO_RESULT.includes(e.kind)&&e.kind!=='adspend'&&e.kind!=='marketing');}
function marginJob(j,d=data){return totalJob(j)-consumption(j)-j.fuel-taxJob(j)-feeJob(j)-sum(linkedExpenses(j,d),e=>e.amount);}
function ledger(d=data){const rows=[];d.payments.forEach(p=>{rows.push({id:p.id,date:p.date,desc:'Recebimento · '+clientName(d.jobs.find(j=>j.id===p.jobId)?.clientId,d),category:'Serviço',in:p.amount,out:p.fee,paid:true,source:'payment',ref:p.jobId});});d.expenses.forEach(e=>{if(e.kind==='adspend')return;rows.push({id:e.id,date:e.date,paidDate:e.paidDate||e.date,desc:e.description,category:KINDS[e.kind],in:e.kind==='contribution'?e.amount:0,out:e.kind==='contribution'?0:e.amount,paid:e.paid,source:'expense',ref:e.jobId||''});});d.purchases.forEach(p=>rows.push({id:p.id,date:p.date,paidDate:p.paidDate||p.date,desc:'Compra · '+(d.products.find(x=>x.id===p.productId)?.name||'Produto'),category:'Estoque',in:0,out:p.amount,paid:p.paid,source:'purchase',ref:''}));return rows;}
function metrics(d=data,m=period,asof=TODAY()){
 const month=x=>monthOf(x)===m, completed=d.jobs.filter(j=>j.status==='done'&&month(j.completedDate)&&j.completedDate<=asof), allDone=d.jobs.filter(j=>j.status==='done'&&j.completedDate<=asof);
 const expenses=d.expenses.filter(e=>month(e.date)&&e.date<=asof), flows=ledger(d), currentFlows=flows.filter(r=>r.paid&&(r.paidDate||r.date)<=asof), flow=flows.filter(r=>r.paid&&month(r.paidDate||r.date)&&(r.paidDate||r.date)<=asof);
 const revenue=sum(completed,totalJob), products=sum(completed,consumption), fuel=sum(completed,j=>j.fuel), taxes=sum(completed,taxJob), fees=sum(completed,feeJob), overhead=sum(expenses.filter(e=>!NO_RESULT.includes(e.kind)),e=>e.amount);
 const cash=d.settings.opening+sum(currentFlows,r=>r.in-r.out), receipts=sum(flow,r=>r.in), outflow=sum(flow,r=>r.out);
 const advances=sum(d.jobs.filter(j=>j.status!=='done'),j=>paidJob(j,d,asof));
 const debts=sum(flows.filter(r=>!r.paid),r=>r.out);
 const taxReserve=Math.max(0,sum(allDone,taxJob)-sum(d.expenses.filter(e=>e.kind==='tax'&&e.date<=asof),e=>e.amount));
 const feeReserve=Math.max(0,sum(allDone,feeJob)-sum(d.payments.filter(p=>p.date<=asof),p=>p.fee));
 const productReserve=Math.max(0,sum(allDone,consumption)-sum(d.purchases,p=>p.amount),sum(d.products,p=>Math.max(0,p.min-stock(p,d,asof))*productCost(p,d)));
 const fuelReserve=Math.max(0,sum(allDone,j=>j.fuel)-sum(d.expenses.filter(e=>e.kind==='fuel'),e=>e.amount));
 const currentMonth=monthOf(asof), actualFixed=sum(d.expenses.filter(e=>e.kind==='fixed'&&monthOf(e.date)===currentMonth),e=>e.amount),actualOwner=sum(d.expenses.filter(e=>e.kind==='owner'&&monthOf(e.date)===currentMonth),e=>e.amount);
 const fixedReserve=Math.max(0,d.settings.fixedTarget-actualFixed), ownerReserve=Math.max(0,d.settings.ownerTarget-actualOwner),maintenanceReserve=Math.max(0,Math.round(sum(allDone,j=>j.km)*d.settings.maintenanceKm)-sum(d.expenses.filter(e=>e.kind==='maintenance'),e=>e.amount));
 const reserves=Math.round(advances+debts+taxReserve+feeReserve+productReserve+fuelReserve+fixedReserve+ownerReserve+maintenanceReserve+d.settings.cashFloor);
 const free=Math.max(0,cash-reserves), marketing=d.settings.reviewed?Math.floor(free*d.settings.marketingShare/100):0;
 return {revenue,products,fuel,taxes,fees,overhead,result:revenue-products-fuel-taxes-fees-overhead,cash,receipts,outflow,completed:completed.length,km:sum(completed,j=>j.km),unpaid:sum(d.jobs.filter(j=>['scheduled','done'].includes(j.status)),j=>Math.max(0,totalJob(j)-paidJob(j,d,asof))),advances,debts,taxReserve,feeReserve,productReserve:Math.round(productReserve),fuelReserve,fixedReserve,ownerReserve,maintenanceReserve,reserves,free,marketing,flow,flows};
}

function stockView(){return heading('Produto no lugar. Custo na conta.','Produtos & estoque','Controle em mL de produto concentrado, antes de diluir.',btn('Novo produto','new-product')+btn(icon('plus')+' Registrar compra','new-purchase','','primary'))+`<div class="grid three mb">${data.products.map(p=>{const qty=stock(p),used=sum(data.jobs.filter(j=>j.status==='done'&&monthOf(j.completedDate)===period),j=>sum(j.usage.filter(u=>u.productId===p.id),u=>u.ml));return `<div class="card"><div class="split">${icon('stock')}${pill(qty<=p.min?'Reposição necessária':'Estoque disponível',qty<=p.min?'amber':'green')}</div><h3 style="margin-top:18px">${esc(p.name)}</h3><div class="stocknum">${decimal(qty/1000,3)} <small>litros disponíveis</small></div><div class="progress"><span style="width:${Math.min(100,Math.max(0,qty/p.pack*100))}%"></span></div><div class="moneyrow"><span>Custo atual / litro</span><strong>${money(productCost(p)*1000)}</strong></div><div class="moneyrow"><span>Consumo em ${period.slice(5)}</span><strong>${decimal(used)} mL</strong></div><div class="moneyrow"><span>Estoque mínimo</span><strong>${decimal(p.min)} mL</strong></div><div class="actions sectionspace">${btn('Ajustar produto','edit-product',`data-id="${p.id}"`,'sm')}${btn('Comprar','new-purchase',`data-product="${p.id}"`,'sm')}</div></div>`}).join('')}</div><div class="card"><div class="cardhead"><h2>Compras e reposições</h2>${periodInput()}</div>${cashTable(ledger().filter(r=>r.source==='purchase'&&monthOf(r.date)===period))}</div><p class="footnote">O serviço só baixa o estoque ao ser concluído. Custos de serviços concluídos ficam registrados e não mudam quando você atualiza o preço de um produto.</p>`;}
function campaignStats(c){const expenses=data.expenses.filter(e=>e.campaignId===c.id),spent=sum(expenses.filter(e=>['adspend','marketing'].includes(e.kind)&&e.date<=TODAY()),e=>e.amount),credit=sum(expenses.filter(e=>e.kind==='adcredit'&&e.paid&&e.date<=TODAY()),e=>e.amount)-sum(expenses.filter(e=>e.kind==='adspend'&&e.date<=TODAY()),e=>e.amount),leads=data.leads.filter(l=>l.campaignId===c.id),jobs=data.jobs.filter(j=>j.campaignId===c.id&&j.status==='done'),revenue=sum(jobs,totalJob),customers=new Set(jobs.map(j=>j.clientId)).size;return {spent,credit,leads:leads.length,revenue,customers,roas:spent?revenue/spent:null,cpl:leads.length?spent/leads.length:null};}

 <div class="notice mb"><p><b>Limite estimado para novo marketing: ${data.settings.reviewed?money(metrics().marketing):'revise seus ajustes'}.</b> ${data.settings.marketingShare}% do caixa livre, após reservas. Você pode registrar gastos reais mesmo antes de revisar esse limite.</p>${btn('Ver ajustes','settings','','sm')}</div>
 <div class="grid two">${data.campaigns.length?data.campaigns.map(c=>{const x=campaignStats(c);return `<article class="card"><div class="cardhead"><div><h2>${esc(c.name)}</h2><p>${esc(c.channel)} · total registrado</p></div>${btn('Editar plano','edit-campaign',`data-id="${c.id}"`,'sm')}</div><div class="valuegrid"><div><small>Gasto em anúncios</small><b>${money(x.spent)}</b></div><div><small>Saldo não consumido</small><b>${money(x.credit)}</b></div><div><small>Serviços realizados</small><b>${money(x.revenue)}</b></div><div><small>Contatos cadastrados</small><b>${x.leads}</b></div><div><small>Custo / contato</small><b>${x.cpl===null?'—':money(x.cpl)}</b></div><div><small>Receita / anúncio</small><b>${x.roas===null?'—':decimal(x.roas)+'×'}</b></div></div>
 ${c.budget||c.dailyBudget?`<div class="campaign-plan">Planejamento: ${c.budget?'<strong>'+money(c.budget)+'</strong> no total':''}${c.budget&&c.dailyBudget?' · ':''}${c.dailyBudget?'<strong>'+money(c.dailyBudget)+'</strong> por dia':''}. Valores configurados aqui não alteram o Meta.</div>`:''}
 <div class="campaign-actions">${btn('+ Adicionar saldo','new-ad',`data-campaign="${c.id}" data-kind="adcredit"`,'primary')}${btn('Registrar gasto','new-ad',`data-campaign="${c.id}" data-kind="${x.credit>0?'adspend':'marketing'}"`)}</div><p class="footnote">${x.customers} clientes atendidos vinculados. Receita de serviços não é lucro nem confirmação de pagamento.</p></article>`;}).join(''):`<div class="card">${empty('Sua primeira campanha começa acima','Você pode criar a campanha junto com o primeiro valor.')}</div>`}</div>

function saveMarketing(f,id=''){

 const description=(o.description||'').trim()||(KINDS[o.kind]+' · '+campaign.name).slice(0,200);

function helpView(){return heading('Clareza antes dos números','Como usar sua gestão','Um jeito simples de transformar atendimentos em decisões.')+`<div class="grid two"><div class="card help"><h2>O caminho de um serviço</h2><details open><summary>1. Preparar sua base</summary><p>Em Ajustes, informe o saldo real da empresa na data inicial. Confira gasolina, consumo do veículo e impostos. Configure quanto deseja reservar para contas fixas, sua remuneração e segurança. Conte o estoque inicial em Produtos.</p></details><details open><summary>2. Orçar, agendar e concluir</summary><p>Cadastre o cliente e o serviço. Informe a viagem completa (ida e volta), produtos concentrados em mL e preço. O orçamento é uma previsão. Ao concluir, os custos são confirmados e o estoque é baixado. Você pode reabrir uma conclusão para corrigir consumo.</p></details><details><summary>3. Registrar o dinheiro que entrou e saiu</summary><p>O botão Receber no atendimento aceita pagamentos parciais e sinal. Para um lanche ou pedágio, use Lançar gasto dentro do serviço. Registre abastecimentos e compras uma única vez. Um serviço concluído ainda pode estar sem pagamento.</p></details><details><summary>4. Proteger seus dados</summary><p>Este HTML funciona sem conta e sem servidor de dados. Os registros são exclusivos deste navegador e deste endereço. Limpar os dados do site pode apagar o controle. Baixe backups frequentes e restaure no outro aparelho. O arquivo de backup contém dados de clientes e deve ficar privado. Não existe senha ou sincronização em nuvem nesta versão.</p></details><details><summary>5. Colocar na Vercel</summary><p>Use este arquivo como index.html na raiz de um projeto estático, sem etapa de build. Antes de substituir o Purifika, baixe o backup JSON no aplicativo antigo. No novo, abra Ajustes → Restaurar / importar. Nenhum dado financeiro vem embutido neste HTML.</p></details></div><div class="card help"><h2>Como os cálculos funcionam</h2><details open><summary>Caixa é diferente de resultado</summary><p>Caixa registra dinheiro efetivamente movimentado. Resultado operacional usa serviços concluídos, consumo de produtos, combustível estimado, impostos, taxas e despesas de competência do período. Não é uma demonstração contábil: depreciação e gastos não cadastrados não estão incluídos.</p></details><details><summary>Produtos: sem descontar duas vezes</summary><p>A compra reduz o caixa e aumenta o estoque. O consumo reduz o estoque e entra no custo do serviço, sem uma nova saída de dinheiro. O custo usa o valor médio do estoque disponível no momento em que você registra/conclui. Valores de serviços anteriores ficam congelados.</p><div class="formula">Custo do produto = mL concentrados × custo por mL.</div><p>Não use o volume da mistura diluída. Exemplo: 100 mL de concentrado em água continuam sendo 100 mL de produto consumido. Este app não recomenda diluição química.</p></details><details><summary>Quilometragem e abastecimento</summary><div class="formula">Combustível da visita = km totais ÷ km/L × preço por litro.</div><p>O consumo estimado entra no resultado da visita. O abastecimento é a saída do caixa. Registre os dois nos lugares corretos; o app não desconta a compra de gasolina novamente do resultado. Se o percurso for compartilhado entre clientes, divida os quilômetros e não repita a viagem inteira.</p></details><details><summary>Reservas e limite de marketing</summary><p>O caixa livre subtrai contas a pagar, sinais de serviços não concluídos, impostos/taxas pendentes, necessidade de reposição, combustível consumido ainda não coberto por abastecimentos, metas restantes de fixos e pró-labore, manutenção por km e piso de segurança.</p><div class="formula">Limite para novo marketing = máximo(0, caixa − reservas) × percentual escolhido.</div><p>Não inclui receitas futuras como dinheiro livre. A reposição considera o maior valor entre recompor o consumo não coberto por compras e atingir o estoque mínimo. Revise metas e obrigações antes de decidir.</p></details><details><summary>Anúncios: aporte não é consumo</summary><p>Adicionar R$60 de saldo reduz o caixa, mas ainda não é R$60 de anúncio consumido. Lance o consumo conforme a plataforma mostrar; só ele entra no resultado. Para cobrança direta no cartão, use Anúncio pago diretamente. Vincule a campanha às conversas e aos serviços para medir retorno.</p></details><details><summary>Preço mínimo e remuneração</summary><p>O simulador soma produtos, combustível, provisão de manutenção por km e gastos extras. Distribui a meta mensal de fixos e pró-labore pelos atendimentos que você estima realizar. Divide tudo pela parcela do preço disponível depois de impostos, taxas e margem desejada. A margem desejada é sobre a venda, não sobre o custo.</p></details><details><summary>Base de referência e limites</summary><p>Conceitos de margem de contribuição, precificação e fluxo de caixa foram consultados no Sebrae. Percentuais e valores devem refletir a sua empresa; não há recomendação universal de imposto, pró-labore ou marketing.</p><p><a href="https://bibliotecas.sebrae.com.br/chronus/ARQUIVOS_CHRONUS/bds/bds.nsf/E809A7FF3D9553E90325714700620C06/$File/NT00031FEA.pdf" target="_blank" rel="noopener noreferrer">Sebrae: margem de contribuição</a> · <a href="https://www.sebrae-sc.com.br/blog/como-fazer-o-fluxo-de-caixa" target="_blank" rel="noopener noreferrer">Sebrae: fluxo de caixa</a></p></details></div></div>`;}
/* FORMS */
function field(label,name,value='',type='text',attrs='',hint=''){if(type==='number'&&/step="0\./.test(attrs)){type='text';attrs+=' inputmode="decimal" data-decimal="true"';}return `<label>${esc(label)}<input name="${esc(name)}" type="${type}" value="${esc(value)}" ${attrs}>${hint?'<small>'+esc(hint)+'</small>':''}</label>`;}
function selectField(label,name,options,value='',attrs=''){return `<label>${esc(label)}<select name="${name}" ${attrs}>${options.map(([k,v])=>`<option value="${esc(k)}" ${String(value)===String(k)?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;}
function textField(label,name,value=''){return `<label>${esc(label)}<textarea name="${name}" maxlength="2500">${esc(value)}</textarea></label>`;}
function formObj(f){return Object.fromEntries(new FormData(f));}
function num(v){if(v===''||v==null)return 0;let s=String(v).trim().replace(/^R\$\s*/i,'').replace(/\s/g,'');if(s.includes(',')){if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+),\d*$/.test(s))throw Error('Use um valor como 60,00 ou 1.250,50.');s=s.replace(/\./g,'').replace(',','.');}if(!/^\d+(?:\.\d*)?$/.test(s))throw Error('Informe um número válido, sem valores negativos.');const n=Number(s);if(!Number.isFinite(n)||n<0||n>1e9)throw Error('Informe um número válido, sem valores negativos.');return n;}
function amount(v){return cents(num(v));}
function requireDate(v){if(!validDate(v))throw Error('Informe uma data válida.');return v;}
function paidDateCheck(v){requireDate(v);if(v>TODAY())throw Error('Pagamentos e recebimentos não podem ter data futura.');if(v<data.settings.openingDate)throw Error('Use uma data a partir do início do controle.');}
function openModal(title,subtitle,body,onSubmit=null,submitLabel='Salvar'){const m=document.getElementById('modal');if(m.open)m.close();modalSubmit=onSubmit;m.innerHTML=`<div class="modalhead"><div><h2 id="modal-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="iconbtn" data-action="close" aria-label="Fechar">${icon('close')}</button></div><form id="modal-form"><div class="modalbody">${body}<p class="form-error" id="modal-error" role="alert"></p></div><div class="modalfoot"><button type="button" class="btn" data-action="close">${onSubmit?'Cancelar':'Fechar'}</button>${onSubmit?`<button type="submit" class="btn primary">${esc(submitLabel)}</button>`:''}</div></form>`;m.showModal();}
function closeModal(){document.getElementById('modal').close();modalSubmit=null;currentJob=null;}
function clientForm(id){const c=data.clients.find(c=>c.id===id)||{name:'',phone:'',address:'',notes:''};openModal(id?'Editar cliente':'Novo cliente','Somente as informações úteis para o atendimento.',`<div class="formgrid">${field('Nome do cliente','name',c.name,'text','required maxlength="120" autocomplete="name"')}${field('WhatsApp com DDD','phone',c.phone,'tel','maxlength="25" autocomplete="tel"')}<div class="span2">${field('Endereço completo','address',c.address,'text','maxlength="350" autocomplete="street-address"')}</div><div class="span2">${textField('Observações','notes',c.notes)}</div></div>`,f=>{const o=formObj(f);const next={id:id||uid(),name:o.name.trim(),phone:o.phone.trim(),address:o.address.trim(),notes:o.notes.trim()};if(!next.name)throw Error('Informe o nome.');return commit(id?'Cliente atualizado':'Cliente cadastrado',d=>{if(id)d.clients[d.clients.findIndex(x=>x.id===id)]=next;else d.clients.push(next);});});}
function leadForm(id){const l=data.leads.find(l=>l.id===id)||{date:TODAY(),name:'',phone:'',interest:'',source:'WhatsApp',stage:'new',campaignId:'',followup:'',notes:''};openModal(id?'Atualizar conversa':'Nova conversa','Não é necessário ter um orçamento fechado para registrar.',`<div class="formgrid">${field('Nome','name',l.name,'text','required maxlength="120"')}${field('WhatsApp','phone',l.phone,'tel','maxlength="25"')}${field('Primeiro contato','date',l.date,'date','required')}${field('Interesse / serviço','interest',l.interest,'text','maxlength="200"')}${selectField('Origem','source',[['WhatsApp','WhatsApp'],['Instagram','Instagram'],['Facebook','Facebook'],['Indicação','Indicação'],['Panfleto','Panfleto'],['Outro','Outro']],l.source)}${selectField('Etapa','stage',[['new','Nova conversa'],['quoted','Orçamento enviado'],['won','Fechado'],['lost','Não fechado']],l.stage)}${selectField('Campanha de origem','campaignId',[['','Sem campanha'],...data.campaigns.map(c=>[c.id,c.name])],l.campaignId)}${field('Data para retomar contato','followup',l.followup,'date')}<div class="span2">${textField('Observações','notes',l.notes)}</div></div>`,f=>{const o=formObj(f);requireDate(o.date);if(o.followup)requireDate(o.followup);if(!o.name.trim())throw Error('Informe o nome.');const n={...o,name:o.name.trim(),id:id||uid()};return commit('Conversa '+(id?'atualizada':'cadastrada'),d=>{if(id)d.leads[d.leads.findIndex(x=>x.id===id)]=n;else d.leads.push(n);});});}
function jobForm(id='',clientId='',leadId=''){
 const j=data.jobs.find(j=>j.id===id);if(j?.status==='done'){toast('Reabra a conclusão antes de alterar os custos.');return;}
 const lead=data.leads.find(l=>l.id===leadId),s=data.settings;
 currentJob={id,leadId:leadId||j?.leadId||''};draftItems=clone(j?.items||[{name:data.catalog[0].name,price:data.catalog[0].price,qty:1,catalogId:data.catalog[0].id}]);
 const body=`<div class="formsection">Cliente e atendimento</div><div class="formgrid">${selectField('Cliente','clientId',[['','Cadastrar cliente neste atendimento'],...data.clients.map(c=>[c.id,c.name])],j?.clientId||clientId)}${selectField('Situação','status',[['quote','Orçamento'],['scheduled','Agendado']],j?.status==='quote'?'quote':'scheduled')}<div id="inline-client" class="span2"><div class="formgrid">${field('Nome do novo cliente','newName',lead?.name||'','text','maxlength="120"')}${field('WhatsApp do novo cliente','newPhone',lead?.phone||'','tel','maxlength="25"')}<div class="span2">${field('Endereço do novo cliente','newAddress','','text','maxlength="350"')}</div></div></div>${field('Data do atendimento','date',j?.date||TODAY(),'date','required')}${field('Horário','time',j?.time||'','time')}${selectField('Campanha de origem','campaignId',[['','Sem campanha / orgânico'],...data.campaigns.map(c=>[c.id,c.name])],j?.campaignId||lead?.campaignId||'')}${field('Prazo para pagamento','dueDate',j?.dueDate||j?.date||TODAY(),'date','required')}</div>
 <div class="formsection">Serviços contratados</div><div id="job-items"></div>${btn('+ Adicionar item','add-item','','sm')}<div class="formgrid sectionspace">${field('Desconto no total (R$)','discount',(j?.discount||0)/100,'number','min="0" step="0.01" required')}${field('Tempo previsto (horas)','hours',j?.hours??1.5,'number','min="0" step="0.25" required')}</div>
 <div class="formsection">Custo da visita</div><div class="formgrid">${field('Distância total, ida e volta (km)','km',j?.km||0,'number','min="0" step="0.1" required','Some todo o trajeto atribuído a este atendimento.')}${field('Imposto estimado (%)','tax',j?.tax??s.tax,'number','min="0" max="99" step="0.01" required')}${field('Taxa de recebimento (%)','fee',j?.fee??s.cardFee,'number','min="0" max="99" step="0.01" required','Percentual sobre o total vendido; ajuste para Pix ou cartão.')}${field('Gasolina usada no cálculo (R$/L)','jobGas',(j?.gasPrice??s.gas)/100,'number','min="0" step="0.01" required')}${field('Consumo do veículo (km/L)','jobKmL',j?.kmL??s.kmL,'number','min="0.1" step="0.1" required')}</div>
 <div class="formsection">Produtos concentrados · total da visita</div><p class="muted" style="font-size:11px;margin-bottom:10px">Informe mL do produto puro, não litros de solução diluída. As quantidades não são recomendações de aplicação.</p>${data.products.map(p=>`<div class="productrow"><label for="u-${p.id}">${esc(p.name)}<small>${decimal(stock(p))} mL disponíveis · ${money(productCost(p)*1000)}/L</small></label><input id="u-${p.id}" name="use_${p.id}" type="number" min="0" step="0.1" value="${j?.usage.find(u=>u.productId===p.id)?.ml||0}" aria-label="Consumo em mL: ${esc(p.name)}"></div>`).join('')}
 <div id="job-preview" class="summarybox"></div><div class="sectionspace">${textField('Observações do serviço','notes',j?.notes||'')}</div><p class="footnote">Salvar agenda não altera o caixa nem baixa estoque. Após o atendimento, confirme o consumo e use Concluir. Receba pelo botão Receber.</p>`;
 openModal(id?'Editar atendimento':'Novo atendimento','Custos e receita sob controle desde o orçamento.',body,f=>saveJobForm(f),id?'Salvar alterações':'Salvar atendimento');renderItems();toggleInlineClient();updateJobPreview();
}
function renderItems(){const el=document.getElementById('job-items');if(!el)return;el.innerHTML=draftItems.map((i,n)=>`<div class="itemrow">${selectField('Serviço','catalog_'+n,[...data.catalog.map(c=>[c.id,c.name]),['custom','Outro serviço']],i.catalogId||'custom','data-item="'+n+'"')}${field('Qtd.','qty_'+n,i.qty,'number','min="1" max="999" step="1" required data-item="'+n+'"')}${field('R$ / unidade','price_'+n,i.price/100,'number','min="0" step="0.01" required data-item="'+n+'"')}<button type="button" class="iconbtn" style="padding:8px 2px" data-action="remove-item" data-index="${n}" aria-label="Remover item ${n+1}">×</button>${i.catalogId==='custom'?`<div style="grid-column:1/-1">${field('Nome do serviço','itemName_'+n,i.name,'text','required maxlength="150" data-item="'+n+'"')}</div>`:''}</div>`).join('');}
function toggleInlineClient(){const f=document.getElementById('modal-form');if(!f?.elements.clientId)return;const hidden=!!f.elements.clientId.value;document.getElementById('inline-client').classList.toggle('hidden',hidden);f.elements.newName.required=!hidden;}
function buildJob(f){const o=formObj(f),items=clone(draftItems);if(!items.length)throw Error('Adicione pelo menos um serviço.');for(const i of items){if(!(i.qty>=1)||!Number.isInteger(i.qty)||!i.name.trim())throw Error('Confira os itens do serviço.');}const price=sum(items,i=>i.price*i.qty),discount=amount(o.discount),km=num(o.km),kmL=num(o.jobKmL),gasPrice=amount(o.jobGas),tax=num(o.tax),fee=num(o.fee);if(discount>price)throw Error('O desconto não pode ultrapassar o valor dos itens.');if(!kmL)throw Error('Consumo do veículo precisa ser maior que zero.');if(tax+fee>=100)throw Error('Imposto e taxa devem somar menos que 100%.');return {id:currentJob.id||uid(),clientId:o.clientId,date:requireDate(o.date),time:o.time,status:o.status,dueDate:requireDate(o.dueDate),campaignId:o.campaignId,leadId:currentJob.leadId,items,discount,km,kmL,gasPrice,fuel:Math.round(km/kmL*gasPrice),hours:num(o.hours),tax,fee,usage:data.products.map(p=>({productId:p.id,ml:num(o['use_'+p.id]),unitCost:productCost(p)})).filter(u=>u.ml>0),notes:o.notes.trim(),createdAt:data.jobs.find(j=>j.id===currentJob.id)?.createdAt||new Date().toISOString()};}
function updateJobPreview(){try{const f=document.getElementById('modal-form'),j=buildJob(f),el=document.getElementById('job-preview');if(!el)return;el.innerHTML=row('Valor do atendimento',totalJob(j))+row('Produtos previstos',-consumption(j))+row('Combustível previsto',-j.fuel)+row('Impostos e taxas',-taxJob(j)-feeJob(j))+row('Contribuição antes de extras e custos fixos',totalJob(j)-consumption(j)-j.fuel-taxJob(j)-feeJob(j),'total')+`<p class="footnote">O resultado final também considera alimentação, pedágios e outros gastos que você vincular a este atendimento.</p>${btn('Simular preço mínimo','price-sim','','sm')}`;}catch(e){const el=document.getElementById('job-preview');if(el)el.innerHTML='<small>'+esc(e.message)+'</small>';}}
function saveJobForm(f){const j=buildJob(f),o=formObj(f),old=data.jobs.find(x=>x.id===j.id);if(old&&totalJob(j)<paidJob(old))throw Error('O valor não pode ficar menor que os recebimentos registrados.');let newClient=null;if(!j.clientId){if(!o.newName.trim())throw Error('Informe o nome do cliente.');newClient={id:uid(),name:o.newName.trim(),phone:o.newPhone.trim(),address:o.newAddress.trim(),notes:''};j.clientId=newClient.id;}return commit(old?'Atendimento atualizado':'Atendimento cadastrado',d=>{if(newClient)d.clients.push(newClient);if(old)d.jobs[d.jobs.findIndex(x=>x.id===j.id)]=j;else d.jobs.push(j);if(j.leadId){const l=d.leads.find(x=>x.id===j.leadId);if(l)l.stage=j.status==='scheduled'?'won':'quoted';}});}
function jobDetail(id){const j=data.jobs.find(j=>j.id===id);if(!j)return;const c=data.clients.find(c=>c.id===j.clientId),payments=data.payments.filter(p=>p.jobId===id),extras=linkedExpenses(j),rem=Math.max(0,totalJob(j)-paidJob(j));const actions=btn('Copiar confirmação','copy-confirm',`data-id="${j.id}"`,'sm')+btn('Imprimir orçamento','print-job',`data-id="${j.id}"`,'sm')+(j.status!=='cancelled'?btn('Lançar gasto','new-expense',`data-job="${j.id}"`,'sm'):'')+(j.status==='done'?btn('Reabrir conclusão','reopen-job',`data-id="${j.id}"`,'sm'):j.status!=='cancelled'?btn('Editar custos','edit-job',`data-id="${j.id}"`,'sm'):'');
 openModal('Atendimento · '+c.name,jobTitle(j),`<div class="split mb"><div>${pill(STATUSES[j.status],j.status==='done'?'green':'')} <span class="muted" style="font-size:12px">${dateBR(j.date)} · ${j.time||'Sem horário'}</span></div>${j.status!=='cancelled'&&rem?btn('Receber','receive',`data-id="${j.id}"`,'primary'):pill(rem?'Cancelado':'Valor recebido',rem?'red':'green')}</div><p class="muted" style="font-size:12px">${esc(c.address||'Endereço não informado')} · ${esc(c.phone||'Sem telefone')}</p><div class="grid two sectionspace"><div><h3>Composição do atendimento</h3>${j.items.map(i=>row(esc(i.qty+' × '+i.name),i.price*i.qty)).join('')}${j.discount?row('Desconto',-j.discount):''}${row('Total',totalJob(j),'total')}${row('Recebido',paidJob(j))}${row('Saldo a receber',rem)}</div><div><h3>${j.status==='done'?'Custos registrados':'Custos previstos'}</h3>${row('Produtos',consumption(j))}${row(decimal(j.km)+' km · combustível',j.fuel)}${row('Impostos e taxas estimados',taxJob(j)+feeJob(j))}${row('Gastos extras vinculados',sum(extras,e=>e.amount))}${row('Contribuição do serviço',marginJob(j),'total')}<small>Antes dos custos fixos e anúncios da empresa.</small></div></div><div class="actions sectionspace">${actions}</div>${j.status==='scheduled'||j.status==='quote'?`<div class="notice sectionspace"><p>Confira o consumo real antes de concluir. A conclusão baixa o estoque, mas não registra pagamento.</p>${btn('Concluir serviço','complete-job',`data-id="${j.id}"`,'primary')}</div>`:''}<div class="sectionspace"><h3>Recebimentos</h3>${payments.length?payments.map(p=>`<div class="moneyrow"><span>${dateBR(p.date)} · ${esc(p.method)}<small style="display:block">Taxa descontada: ${money(p.fee)}</small></span><strong>${money(p.amount)} ${btn('Estornar','reverse',`data-id="${p.id}" data-source="payment"`,'ghost sm')}</strong></div>`).join(''):'<p class="muted" style="font-size:12px;margin-top:8px">Ainda sem recebimentos registrados.</p>'}</div>${j.notes?'<p class="sectionspace muted"> function migratePurifika(old){if(!old||!old.settings||!Array.isArray(old.entries)||!old.estoque||old.entries.length>50000)throw Error('Este arquivo não é um backup Purifika válido.');old.entries.forEach(e=>{if(!e||!validDate(e.data)||!['receita','despesa'].includes(e.tipo)||typeof e.valor!=='number'||!Number.isFinite(e.valor)||typeof e.descricao!=='string')throw Error('Há um lançamento Purifika inválido.');});const d=fresh(),s=old.settings;
 d.legacy={entries:clone(old.entries),settings:clone(s),estoque:clone(old.estoque),importedAt:new Date().toISOString()};
 d.settings.kmL=Number(s.kmPorLitro)||12;d.settings.gas=cents(s.precoGasolina??6.10);d.settings.tax=Number(s.aliquotaImposto??6);d.settings.monthlyGoal=cents(s.metaMensal??3000);d.catalog.forEach(c=>{if(s.prices?.[c.id]){c.price=cents(s.prices[c.id].preco);c.name=String(s.prices[c.id].label||c.name);}});

 validate(d);return d;

function demoData(){const d=fresh(),today=TODAY(),base=today.slice(0,8)+'01';d.settings={...d.settings,opening:85000,openingDate:base,fixedTarget:18000,ownerTarget:60000,cashFloor:30000,maintenanceKm:15,reviewed:true,tax:6};d.products.forEach(p=>p.initial=p.pack);d.campaigns=[{id:'demo-camp',name:'Demonstração · campanha local',channel:'Meta Ads'}];const names=['Cliente exemplo A','Cliente exemplo B','Cliente exemplo C','Cliente exemplo D'];d.clients=names.map((name,i)=>({id:'demo-c'+i,name,phone:'',address:'Endereço demonstrativo',notes:'Cadastro fictício'}));
 [29000,17900,35000,14900].forEach((price,i)=>{const scheduled=i===3,j={id:'demo-j'+i,clientId:'demo-c'+i,date:today,time:scheduled?'14:00':'09:00',dueDate:today,status:scheduled?'scheduled':'done',items:[{name:i===2?'Sofá retrátil':'Sofá 2 lugares',price,qty:1,catalogId:'custom'}],discount:0,km:18+i*4,kmL:12,gasPrice:610,fuel:Math.round((18+i*4)/12*610),hours:1.5,tax:6,fee:0,usage:[{productId:'xtraction',ml:120,unitCost:2},{productId:'refresh',ml:30,unitCost:3.5}],campaignId:'demo-camp',leadId:'',notes:'Exemplo, sem relação com resultados reais.',createdAt:new Date().toISOString()};if(!scheduled){j.completedDate=today;d.payments.push({id:'demo-p'+i,jobId:j.id,date:today,amount:price,fee:0,method:'Pix'});}d.jobs.push(j);});
 d.leads=[{id:'demo-l1',name:'Contato exemplo',phone:'',interest:'Limpeza de colchão',source:'Instagram',stage:'quoted',date:today,followup:today,campaignId:'demo-camp',notes:'Demonstração'}];d.expenses=[{id:'demo-e1',kind:'adcredit',description:'Saldo de anúncios · exemplo',amount:6000,date:today,paidDate:today,paid:true,jobId:'',campaignId:'demo-camp'},{id:'demo-e2',kind:'adspend',description:'Consumo de anúncios · exemplo',amount:4200,date:today,paidDate:today,paid:true,jobId:'',campaignId:'demo-camp'},{id:'demo-e3',kind:'food',description:'Lanche no atendimento · exemplo',amount:1800,date:today,paidDate:today,paid:true,jobId:'demo-j0',campaignId:''},{id:'demo-e4',kind:'fuel',description:'Abastecimento · exemplo',amount:7000,date:today,paidDate:today,paid:true,jobId:'',campaignId:''}];validate(d);return d;
}
function startDemo(){if(demo)return;realData=data;data=demoData();demo=true;view='home';period=monthOf(TODAY());render();}
function exitDemo(){if(!demo)return;data=realData;realData=null;demo=false;view='home';render();}
function saveSettings(f){const o=formObj(f),s={...data.settings};['opening','gas','fixedTarget','ownerTarget','cashFloor','maintenanceKm','monthlyGoal'].forEach(k=>s[k]=amount(o[k]));['kmL','tax','cardFee','marketingShare'].forEach(k=>s[k]=num(o[k]));s.openingDate=requireDate(o.openingDate);s.reviewed=!!o.reviewed;if(s.openingDate>TODAY())throw Error('A data inicial não pode estar no futuro.');if(!s.kmL||s.tax+s.cardFee>=100||s.marketingShare>100)throw Error('Confira consumo e percentuais.');return commit('Base financeira atualizada',d=>d.settings=s);}
async function action(el){const a=el.dataset.action,id=el.dataset.id;if(navItems.some(n=>n[0]===a)){setView(a);return;}switch(a){
 case 'close':closeModal();break;case 'new-client':clientForm();break;case 'edit-client':clientForm(id);break;
 case 'new-lead':leadForm();break;case 'edit-lead':leadForm(id);break;case 'convert-lead':{const existing=data.jobs.find(j=>j.leadId===id&&j.status!=='cancelled');existing?jobDetail(existing.id):jobForm('','',id);break;}
 case 'new-job':jobForm('',el.dataset.client||'');break;case 'edit-job':jobForm(id);break;case 'job-detail':jobDetail(id);break;case 'receive':paymentForm(id);break;case 'complete-job':completeForm(id);break;case 'reopen-job':reopenJob(id);break;case 'cancel-job':cancelJob(id);break;
 case 'new-expense':expenseForm(el.dataset.job||'');break;case 'new-ad':focusMarketing(el.dataset.campaign||'',el.dataset.kind||'adcredit');break;case 'edit-ad':editAd(id);break;case 'mobile-more':toggleMenu();break;case 'new-product':productForm();break;case 'edit-product':productForm(id);break;case 'new-purchase':purchaseForm(el.dataset.product||'');break;case 'new-campaign':campaignForm();break;case 'edit-campaign':campaignForm(id);break;
 case 'add-item':{const c=data.catalog[0];draftItems.push({name:c.name,price:c.price,qty:1,catalogId:c.id});renderItems();updateJobPreview();break;}case 'remove-item':if(draftItems.length<=1){toast('Mantenha pelo menos um serviço.');return;}draftItems.splice(Number(el.dataset.index),1);renderItems();updateJobPreview();break;case 'price-sim':simulator();break;
 case 'backup':backup();break;case 'import':if(demo){toast('Saia da demonstração antes de importar.');return;}document.getElementById('import-file').click();break;
 case 'import-local':{const raw=localStorage.getItem('purifika_state_v2');if(!raw){toast('Não encontrei o Purifika neste endereço. Exporte o JSON no app antigo e use Restaurar / importar.',7000);return;}importObject(JSON.parse(raw));break;}
 case 'recovery':recover();break;case 'export-csv':csvExport();break;case 'csv':csvExport();break;case 'print-report':printReport();break;case 'print-job':printJob(id);break;case 'copy-confirm':await copyConfirmation(id);break;
 case 'settle':settleForm(el.dataset.source,id);break;case 'reverse':reverse(el.dataset.source,id);break;case 'demo':startDemo();break;case 'exit-demo':exitDemo();break;case 'logo':document.getElementById('logo-file').click();break;case 'reset-logo':commit('Símbolo padrão restaurado',d=>d.settings.logo='');break;
 default:toast('Esta ação não está disponível.');
}}
/* INIT */
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}const a=e.target.closest('[data-action]');if(a){e.preventDefault();try{await action(a);}catch(err){toast(err.message,6000);}}});
document.addEventListener('submit',e=>{e.preventDefault();try{if(e.target.id==='modal-form'&&modalSubmit){if(modalSubmit(e.target)){closeModal();toast('Registro salvo.');}}else if(e.target.id==='marketing-form'){if(saveMarketing(e.target))toast('Valor salvo. Campanha e financeiro atualizados.');}else if(e.target.id==='settings-form'){if(saveSettings(e.target))toast('Ajustes salvos.');}else if(e.target.id==='catalog-form'){const o=formObj(e.target);if(commit('Tabela de serviços atualizada',d=>d.catalog.forEach(c=>c.price=amount(o[c.id]))))toast('Tabela salva.');}}catch(err){const box=document.getElementById(e.target.id==='marketing-form'?'marketing-error':'modal-error');if(['marketing-form','modal-form'].includes(e.target.id)&&box){box.textContent=err.message;box.scrollIntoView({block:'nearest'});}else toast(err.message,6000);}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='filter'){filter=t.value;const list=document.getElementById('list-content');if(list)list.innerHTML=view==='jobs'?jobList():clientList();mobileTables();return;}if(t.form?.id!=='modal-form')return;try{if(t.name?.startsWith('sim')){updateSim();return;}if(t.dataset.item!==undefined){const i=draftItems[Number(t.dataset.item)];if(t.name.startsWith('catalog_')){const c=data.catalog.find(c=>c.id===t.value);i.catalogId=c?.id||'custom';i.name=c?.name||'Novo serviço';if(c)i.price=c.price;renderItems();}else if(t.name.startsWith('price_'))i.price=amount(t.value);else if(t.name.startsWith('qty_'))i.qty=num(t.value);else if(t.name.startsWith('itemName_'))i.name=t.value;}if(document.getElementById('job-preview'))updateJobPreview();}catch(err){const p=document.getElementById('job-preview');if(p)p.textContent=err.message;}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='period'&&/^\d{4}-\d{2}$/.test(t.value)){period=t.value;render();}else if(t.id==='status-filter'){statusFilter=t.value;const l=document.getElementById('list-content');if(l)l.innerHTML=jobList();}else if(t.name==='clientId'&&document.getElementById('inline-client'))toggleInlineClient();else if(t.form?.id==='marketing-form')updateMarketingEntry();mobileTables();});
document.getElementById('import-file').addEventListener('change',e=>readImport(e.target.files[0]));
document.getElementById('logo-file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>500*1024){toast('Use PNG, JPEG ou WebP de até 500 KB.');e.target.value='';return;}const r=new FileReader();r.onload=()=>{if(commit('Logo atualizada',d=>d.settings.logo=r.result))toast('Logo atualizada.');};r.onerror=()=>toast('Não foi possível abrir a imagem.');r.readAsDataURL(file);e.target.value='';});
document.getElementById('menu-toggle').addEventListener('click',()=>toggleMenu());
document.getElementById('mask').addEventListener('click',()=>toggleMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false);});
window.addEventListener('storage',e=>{if(e.key!==KEY||demo)return;if(document.getElementById('modal').open||view==='settings'){toast('Os dados mudaram em outra aba. Recarregue antes de salvar.',7000);return;}storageBlocked=false;data=load();render();});
render();
</script>
</body>
